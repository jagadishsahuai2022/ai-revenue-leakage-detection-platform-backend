services:
  postgres:
    image: postgres:17-alpine
    container_name: revsecurecloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revsecurecloud_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revsecurecloud_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
